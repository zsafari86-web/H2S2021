<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاسبه طول مماس‌های مشترک و وتر مشترک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f7;--ink:#12303a;--teal:#0b7f80;--blue:#2563eb;--pink:#d1346f;--am:#c98500;--card:#fff;--line:#cfe3e0;--ok:#1b8f5a;--mut:#6a858c;--pur:#8e63f2;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1f;--ink:#e3f1ef;--teal:#37c4be;--blue:#60a5fa;--pink:#ff7aa8;--am:#ffc247;--card:#16282d;--line:#27424a;--ok:#4fd592;--mut:#97b3b8;--pur:#c084fc}}
:root[data-theme="dark"]{--bg:#0e1b1f;--ink:#e3f1ef;--teal:#37c4be;--blue:#60a5fa;--pink:#ff7aa8;--am:#ffc247;--card:#16282d;--line:#27424a;--ok:#4fd592;--mut:#97b3b8;--pur:#c084fc}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2.1;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
header{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header b{font-size:1.05rem;font-weight:800}
.author{font-size:.82rem;font-weight:600;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font:inherit;font-size:.8rem;cursor:pointer;line-height:1}
.dots button.on{background:#fff;color:var(--teal);font-weight:800}
.skip{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:2px 12px;font:inherit;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:0 14px 60px}

/* کادر چسبنده با ارتفاع کنترل‌شده برای دیده شدن دائمی شکل */
#fig{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);box-shadow:0 4px 12px -4px rgba(0,0,0,.08)}
#fig:empty{display:none}
svg{user-select:none;-webkit-user-select:none;width:100%;height:auto;display:block;direction:ltr;touch-action:none;max-height:27vh}

#txt>*{scroll-margin-top:34vh}
h2{margin:12px 0 6px;font-size:1.25rem;color:var(--teal);font-weight:800}
.p,.ex{margin:8px 0}
.obj{border:2px solid var(--blue);border-right:6px solid var(--blue);border-radius:10px;background:var(--card);padding:8px 14px;margin:10px 0;font-weight:700;color:var(--blue);line-height:2.2}
.d{border:2px solid var(--teal);border-radius:12px;background:var(--card);padding:10px 16px;margin:10px 0;font-weight:600}
.ex{border-right:4px solid var(--pink);padding:6px 14px;background:var(--card);border-radius:6px}

/* استایل ریاضی مجزا */
.f,.f2{direction:ltr!important;text-align:center;font-weight:700;color:var(--pink);margin:8px auto;padding:6px 12px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;line-height:1.8;background:rgba(209,52,111,.05);border-radius:8px;border:1px dashed rgba(209,52,111,.25);unicode-bidi:isolate}
.f{font-size:1.22rem;min-height:2.2em}
.f2{font-size:1.12rem}

.math-tag{direction:ltr!important;font-family:inherit;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--pink);background:rgba(209,52,111,.06);padding:3px 8px;border-radius:6px;border:1px dashed rgba(209,52,111,.25);font-size:1rem}
.rad{display:inline-flex;align-items:baseline;direction:ltr;unicode-bidi:isolate;white-space:nowrap;margin:0 2px}
.r-sym{font-size:1.2em;line-height:1;margin-right:1px;font-family:system-ui,-apple-system,sans-serif;user-select:none}
.r-body{border-top:2px solid currentColor;padding:0 3px;line-height:1.2;display:inline-block;white-space:nowrap;font-size:.95em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .35em;line-height:1.2}
.fr .n{border-bottom:2px solid currentColor;padding:0 .45em}.fr .dn{padding:0 .45em}

.typing::after{content:"▍";color:var(--pink);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.demo,.quiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}
#fig .demo{margin:0;box-shadow:none;border:0;padding:4px}

/* نوار محاسبات فشرده */
.ctl-panel{direction:rtl;background:rgba(0,0,0,.025);border-radius:8px;padding:4px 8px;margin-top:4px;border:1px solid var(--line)}
.ctl-row{display:flex;align-items:center;gap:8px;font-size:.82rem}
.ctl-row label{font-weight:700;color:var(--teal);white-space:nowrap}
.ctl-row input[type=range]{flex:1;accent-color:var(--teal);cursor:pointer;height:4px}
.ctl-val{font-weight:700;direction:ltr;min-width:32px;text-align:left}
.stat-strip{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.8rem;padding-top:4px;border-top:1px dashed var(--line);flex-wrap:wrap}
.stat-strip b{direction:ltr;display:inline-block;color:var(--pink)}

button.go,.opt{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--teal);background:transparent;color:var(--ink);padding:6px 16px}
button.go{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600;margin:10px 0}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;justify-content:center}
.opt{min-width:90px;font-weight:700;direction:ltr!important;unicode-bidi:isolate}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--pink);color:var(--pink)}
.fb{min-height:1.8em;color:var(--mut);text-align:center;font-weight:600}

/* خطوط و دایره‌ها در SVG */
circle.cir-blue{fill:none;stroke:var(--blue);stroke-width:2.6}
circle.cir-pur{fill:none;stroke:var(--pur);stroke-width:2.6}
circle.aux{fill:none;stroke:var(--pur);stroke-width:2;stroke-dasharray:5 4}
.ln-blue{stroke:var(--blue);stroke-width:2.2}
.ln-pur{stroke:var(--pur);stroke-width:2.2}
.ln{stroke:var(--ink);stroke-width:1.8}
.ln-tan{stroke:var(--teal);stroke-width:2.8;stroke-linecap:round}
.ln-help{stroke:var(--pink);stroke-width:2.2;stroke-dasharray:5 4}
.pt{fill:var(--card);stroke:var(--ink);stroke-width:2}
.pt-blue{fill:var(--blue);stroke:#fff;stroke-width:2}
.pt-pur{fill:var(--pur);stroke:#fff;stroke-width:2}
.pt-tan{fill:var(--am);stroke:var(--ink);stroke-width:2}
.tf{fill:none;stroke:none}
.tf.h1{fill:var(--blue);fill-opacity:.22;stroke:var(--blue);stroke-width:2}
.tf.h2{fill:var(--pur);fill-opacity:.22;stroke:var(--pur);stroke-width:2}
.sq{fill:none;stroke:var(--pink);stroke-width:2}
text.lb{font:600 15px Vazirmatn,sans-serif;fill:var(--ink)}

/* جدول خلاصه فرمول‌ها */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.03)}
.tbl-hint{font-size:.78rem;color:var(--mut);text-align:center;padding:6px;background:rgba(11,127,128,.05);border-bottom:1px solid var(--line)}
.tbl{width:100%;min-width:530px;border-collapse:collapse}
.tbl th,.tbl td{border:1px solid var(--line);padding:10px 12px;text-align:center;font-size:.9rem;vertical-align:middle;line-height:1.8}
.tbl th{background:rgba(11,127,128,.14);color:var(--teal);font-weight:800;white-space:nowrap}
.tbl tr:hover{background:rgba(11,127,128,.04)}

.st{font-weight:800;color:var(--pink);margin:14px 0 2px}
.nw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.nf{animation:fi 0.8s}
@keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.typing::after,.nw,.nf{animation:none}.nw{stroke-dasharray:none}}
</style>
</head>

<header>
  <b>محاسبه طول مماس‌های مشترک و وتر مشترک</b>
  <span class="author">طراح: زینب صفری</span>
  <div class="dots" id="dots"></div>
  <button class="skip" id="skip">سریع‌تر تایپ کن</button>
</header>
<main><div id="fig"></div><div id="txt"></div></main>
<script>
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
let fast=false,run=0,F=null;
$('#skip').onclick=()=>fast=true;

const scroll=e=>{
 const figEl=$('#fig');
 const figH=figEl?(figEl.offsetHeight||0):0;
 const r=e.getBoundingClientRect();
 if(r.bottom>window.innerHeight-25){
  window.scrollBy({top:r.bottom-window.innerHeight+85,behavior:'auto'});
 }
 if(r.top<figH+10){
  window.scrollBy({top:r.top-figH-20,behavior:'auto'});
 }
};

function formatMath(str){
 let s = str;
 s = s.replace(/√\(((?:\([^()]+\)|[^()])+)\)/g, '<span class="rad"><span class="r-sym">√</span><span class="r-body">$1</span></span>');
 s = s.replace(/√([0-9a-zA-Z\u200E′]+)/g, '<span class="rad"><span class="r-sym">√</span><span class="r-body">$1</span></span>');
 s = s.replace(/(\S+) \/ (\S+)/g, '<span class="fr"><span class="n">$1</span><span class="dn">$2</span></span>');
 return s;
}

async function typeInto(e,txt,tok){
 e.classList.add('typing');let n=0;
 for(const ch of txt){
  if(tok!==run)return;
  e.textContent+=ch;
  if(++n%5===0)scroll(e);
  if(!fast)await sleep(ch===' '?28:55);
 }
 scroll(e);
 e.classList.remove('typing');
}

async function typeFormula(e,str,tok){
 e.classList.add('typing');
 e.innerHTML=formatMath(str);
 scroll(e);
 if(!fast)await sleep(350);
 e.classList.remove('typing');
}

function mark(i){document.querySelectorAll('#dots button').forEach((b,j)=>b.classList.toggle('on',i===j));}
S.forEach((s,i)=>{const b=el('button');b.textContent=i+1;b.onclick=()=>stage(i);$('#dots').append(b)});

async function stage(i){
 const tok=++run;fast=false;const s=S[i],box=$('#txt');box.innerHTML='';mark(i);window.scrollTo(0,0);
 $('#fig').innerHTML='';F=s.k?mkFig(s.k):null;if(F)$('#fig').append(F.w);
 const h=el('h2');box.append(h);await typeInto(h,s.h,tok);
 for(const [k,v,sh,hl] of s.items){
  if(tok!==run)return;
  if(k==='tbl'){
   const tw=el('div','tbl-wrap');tw.innerHTML=v;box.append(tw);scroll(tw);
   if(!fast)await sleep(500);continue;
  }
  if(k==='quiz'){await quiz(box,v);continue}
  if(k==='btn'){await gate(box,v);continue}
  const e=el('div',k==='obj'?'obj':k);box.append(e);scroll(e);
  const segs=Array.isArray(v)?v:[[v,sh,hl]];
  for(const [t,a,b] of segs){
    if(tok!==run)return;
    if(F&&(a!=null||b))F.cue(a,b);
    await (k==='f'||k==='f2'?typeFormula:typeInto)(e,t,tok);
  }
  if(!fast)await sleep(k==='p'||k==='ex'||k==='d'||k==='obj'?500:300);
 }
 if(tok!==run)return;
 const n=el('button','go');n.textContent=i<S.length-1?'گام بعدی ◀':'شروع دوباره';n.onclick=()=>stage((i+1)%S.length);box.append(n);scroll(n);
}
function gate(box,label){return new Promise(r=>{const b=el('button','go');b.textContent=label;b.onclick=()=>{b.remove();r()};box.append(b);scroll(b)})}
function quiz(box,v){return new Promise(res=>{
 const q=el('div','quiz'),t=el('b'),row=el('div','opts'),fb=el('div','fb');t.textContent=v.q;
 v.o.forEach((s,i)=>{const b=el('button','opt');b.textContent=s;b.onclick=()=>{
  if(i===v.a){b.classList.add('ok');fb.textContent='آفرین! '+v.e;row.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(res,1500);}
  else{b.classList.add('no');fb.textContent='دوباره فکر کن. راهنما: '+v.h;}};row.append(b)});
 q.append(t,row,fb);box.append(q);scroll(q);})}

function rightAngle(V,P1,P2,size=11){
 const v1={x:(P1.x-V.x)/Math.hypot(P1.x-V.x,P1.y-V.y),y:(P1.y-V.y)/Math.hypot(P1.x-V.x,P1.y-V.y)};
 const v2={x:(P2.x-V.x)/Math.hypot(P2.x-V.x,P2.y-V.y),y:(P2.y-V.y)/Math.hypot(P2.x-V.x,P2.y-V.y)};
 const a={x:V.x+v1.x*size,y:V.y+v1.y*size};
 const b={x:a.x+v2.x*size,y:a.y+v2.y*size};
 const c={x:V.x+v2.x*size,y:V.y+v2.y*size};
 return `M${a.x} ${a.y} L${b.x} ${b.y} L${c.x} ${c.y}`;
}

function mkFig(kind){
 const w=el('div','demo'),svg=document.createElementNS(NS,'svg'),ctl=el('div','ctl-panel');
 svg.setAttribute('viewBox','0 0 520 280');

 const vis=new Set(),fresh=new Set();let hl={};
 
 let state={

 };

  ctl.innerHTML='';

  if(kind==='fig_ext'||kind==='fig_int'){
   rows=`
    <div class="ctl-row"><label>فاصله مرکزها (d):</label><input type="range" id="sl-d" min="${kind==='fig_ext'?140:150}" max="280" value="${state.d}"><span class="ctl-val" id="vl-d">${state.d}</span></div>
    <div class="stat-strip" id="calc-strip"></div>
   `;
  } else if(kind==='fig_tan_int'){
   rows=`
    <div class="ctl-row"><label>شعاع کوچک (R′):</label><input type="range" id="sl-R2" min="30" max="65" value="${state.R2}"><span class="ctl-val" id="vl-R2">${state.R2}</span></div>
    <div class="stat-strip" id="calc-strip"></div>
   `;
  } else if(kind==='fig_sec'){
   rows=`
    <div class="ctl-row"><label>فاصله مرکزها (d):</label><input type="range" id="sl-d" min="70" max="145" value="${state.d}"><span class="ctl-val" id="vl-d">${state.d}</span></div>
    <div class="stat-strip" id="calc-strip"></div>
   `;
  } else {
   rows=`<div class="stat-strip" id="calc-strip"></div>`;
  }
  ctl.innerHTML=rows;

  const bind=(id,prop)=>{
   const sl=ctl.querySelector('#'+id);
   if(sl)sl.oninput=e=>{
    state[prop]=parseFloat(e.target.value);
    const vl=ctl.querySelector('#vl-'+prop);
    if(vl)vl.textContent=state[prop];
    draw();
   };
  };
  bind('sl-d','d');bind('sl-R2','R2');
 }

 function draw(){
  const c=(k,base,isFill)=>base+(hl[k]?' h'+hl[k]:'')+(fresh.has(k)?(isFill?' nf':' nw'):'');
  const V=k=>vis.has(k);
  let s='';
  const calcBox=ctl.querySelector('#calc-strip');

  if(kind==='fig_ext'||kind==='fig_aux'){
   const cy=145, O={x:135,y:cy}, R=state.R, R2=state.R2, d=state.d, O2={x:O.x+d,y:cy};
   const diffR=R-R2, valid=d>diffR;
   const sinG=valid?diffR/d:0, cosG=Math.sqrt(Math.max(0,1-sinG*sinG));
   const T={x:O.x+R*sinG, y:O.y-R*cosG}, T2={x:O2.x+R2*sinG, y:O2.y-R2*cosG};
   const H={x:O.x+diffR*sinG, y:O.y-diffR*cosG};
   const ttLen=valid?Math.sqrt(d*d-diffR*diffR):0;

   if(V('triH'))s+=`<polygon class="${c('triH','tf h2',1)}" points="${O.x},${O.y} ${O2.x},${O2.y} ${H.x},${H.y}"/>`;
   if(V('rectH'))s+=`<polygon class="${c('rectH','tf h1',1)}" points="${H.x},${H.y} ${O2.x},${O2.y} ${T2.x},${T2.y} ${T.x},${T.y}"/>`;
   if(V('sOO'))s+=`<line pathLength="1" class="${c('sOO','ln')}" stroke-dasharray="4 4" x1="${O.x}" y1="${O.y}" x2="${O2.x}" y2="${O2.y}"/>`;
   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;
   if(V('circAux'))s+=`<circle class="${c('circAux','aux',1)}" cx="${O.x}" cy="${O.y}" r="${diffR}"/>`;
   if(V('sOT'))s+=`<line pathLength="1" class="${c('sOT','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${T.x}" y2="${T.y}"/>`;
   if(V('sOpTp'))s+=`<line pathLength="1" class="${c('sOpTp','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${T2.x}" y2="${T2.y}"/>`;

   if(V('sqH'))s+=`<path class="${c('sqH','sq',1)}" d="${rightAngle(H,O,O2)}"/>`;

   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-8}" y="${O.y+22}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y+22}">O′</text>`;
   if(V('pT'))s+=`<circle class="pt-tan nf" cx="${T.x}" cy="${T.y}" r="4.5"/><text class="lb nf" x="${T.x-8}" y="${T.y-10}">T</text>`;
   if(V('pTp'))s+=`<circle class="pt-tan nf" cx="${T2.x}" cy="${T2.y}" r="4.5"/><text class="lb nf" x="${T2.x+6}" y="${T2.y-10}">T′</text>`;

   }
  }
  else if(kind==='fig_int'){
   const cy=140, O={x:125,y:cy}, R=state.R, R2=state.R2, d=state.d, O2={x:O.x+d,y:cy};
   const sumR=R+R2, valid=d>sumR;
   const sinB=valid?sumR/d:0, cosB=Math.sqrt(Math.max(0,1-sinB*sinB));
   const T={x:O.x+R*sinB, y:O.y-R*cosB}, T2={x:O2.x-R2*sinB, y:O2.y+R2*cosB};

   if(V('sOO'))s+=`<line pathLength="1" class="${c('sOO','ln')}" stroke-dasharray="4 4" x1="${O.x}" y1="${O.y}" x2="${O2.x}" y2="${O2.y}"/>`;

   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;
   if(V('sOT'))s+=`<line pathLength="1" class="${c('sOT','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${T.x}" y2="${T.y}"/>`;

   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y+22}">O′</text>`;
   if(V('pT'))s+=`<circle class="pt-tan nf" cx="${T.x}" cy="${T.y}" r="4.5"/><text class="lb nf" x="${T.x-14}" y="${T.y-10}">T</text>`;
   if(V('pTp'))s+=`<circle class="pt-tan nf" cx="${T2.x}" cy="${T2.y}" r="4.5"/><text class="lb nf" x="${T2.x+10}" y="${T2.y+12}">T′</text>`;
   if(V('pH'))s+=`<circle class="pt nf" cx="${H.x}" cy="${H.y}" r="4"/><text class="lb nf" x="${H.x+8}" y="${H.y-6}">H</text>`;

   if(calcBox){
    calcBox.innerHTML=`<span>فاصله: <b>d = ${(d/16).toFixed(1)}</b></span> <span>مماس داخلی: <b>TT′ = ${(ttLen/16).toFixed(1)}</b></span>`;
   }
  }
  else if(kind==='fig_tan_ext'){
   const cy=140, R=state.R, R2=state.R2, d=R+R2;
   const O={x:185,y:cy}, O2={x:O.x+d,y:cy};
   const sinG=(R-R2)/d, cosG=Math.sqrt(1-sinG*sinG);
   const T={x:O.x+R*sinG, y:O.y-R*cosG}, T2={x:O2.x+R2*sinG, y:O2.y-R2*cosG};
   const ttLen=2*Math.sqrt(R*R2);

   if(V('sOO'))s+=`<line pathLength="1" class="${c('sOO','ln')}" stroke-dasharray="4 4" x1="${O.x}" y1="${O.y}" x2="${O2.x}" y2="${O2.y}"/>`;
   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;
   if(V('sOT'))s+=`<line pathLength="1" class="${c('sOT','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${T.x}" y2="${T.y}"/>`;
   if(V('sOpTp'))s+=`<line pathLength="1" class="${c('sOpTp','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${T2.x}" y2="${T2.y}"/>`;
   if(V('lineM'))s+=`<line pathLength="1" class="${c('lineM','ln-tan')}" x1="${T.x-40*cosG}" y1="${T.y-40*sinG}" x2="${T2.x+40*cosG}" y2="${T2.y+40*sinG}"/>`;

   if(V('pC'))s+=`<circle class="pt-tan nf" cx="${O.x+R}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x+R-4}" y="${O.y-10}">C</text>`;
   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-8}" y="${O.y+22}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y+22}">O′</text>`;
   if(V('pT'))s+=`<circle class="pt-tan nf" cx="${T.x}" cy="${T.y}" r="4.5"/><text class="lb nf" x="${T.x-8}" y="${T.y-10}">T</text>`;
   if(V('pTp'))s+=`<circle class="pt-tan nf" cx="${T2.x}" cy="${T2.y}" r="4.5"/><text class="lb nf" x="${T2.x+6}" y="${T2.y-10}">T′</text>`;

   if(calcBox){
    calcBox.innerHTML=`<span>d = R + R′ = <b>${(d/16).toFixed(1)}</b></span> <span>مماس طلایی: <b>TT′ = ${(ttLen/16).toFixed(1)}</b></span>`;
   }
  }
  else if(kind==='fig_tan_int'){
   const cy=140, R=state.R, R2=state.R2, d=R-R2;
   const O={x:210,y:cy}, C={x:O.x+R, y:cy}, O2={x:C.x-R2, y:cy};

   if(V('lineCenter'))s+=`<line pathLength="1" class="${c('lineCenter','ln')}" stroke-dasharray="4 4" x1="${O.x-R-15}" y1="${cy}" x2="${C.x+25}" y2="${cy}"/>`;
   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;
   if(V('lineM'))s+=`<line pathLength="1" class="${c('lineM','ln-tan')}" x1="${C.x}" y1="${cy-120}" x2="${C.x}" y2="${cy+120}"/>`;
   if(V('sqC'))s+=`<path class="${c('sqC','sq',1)}" d="${rightAngle(C,O,{x:C.x,y:cy-45})}"/>`;
   if(V('sOO'))s+=`<line class="ln-help" stroke-width="2.5" x1="${O.x}" y1="${cy}" x2="${O2.x}" y2="${cy}"/>`;

   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-8}" y="${O.y+22}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x-4}" y="${O2.y+22}">O′</text>`;
   if(V('pC'))s+=`<circle class="pt-tan nf" cx="${C.x}" cy="${C.y}" r="5.5"/><text class="lb nf" x="${C.x+10}" y="${C.y+5}">C</text>`;

   if(calcBox){
    calcBox.innerHTML=`<span>فاصله مرکزها: <b>d = R - R′ = ${(d/16).toFixed(1)}</b></span> <span>مماس: <b>۱ مماس (در C)</b></span>`;
   }
  }
  else if(kind==='fig_sec'){
   const cy=140, R=state.R, R2=state.R2, d=state.d;
   const O={x:185,y:cy}, O2={x:O.x+d,y:cy};
   const a=(R*R-R2*R2+d*d)/(2*d);
   const h=Math.sqrt(Math.max(0,R*R-a*a));
   const midX=O.x+a, A={x:midX,y:cy-h}, B={x:midX,y:cy+h};

   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;
   if(V('lineOO'))s+=`<line pathLength="1" class="${c('lineOO','ln')}" style="stroke:var(--teal);stroke-width:2.4" x1="${O.x-30}" y1="${cy}" x2="${O2.x+30}" y2="${cy}"/>`;
   if(V('chordAB'))s+=`<line pathLength="1" class="${c('chordAB','ln')}" style="stroke:var(--pink);stroke-width:2.6" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;

   if(V('sOA'))s+=`<line pathLength="1" class="${c('sOA','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>`;
   if(V('sOB'))s+=`<line pathLength="1" class="${c('sOB','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>`;
   if(V('sOpA'))s+=`<line pathLength="1" class="${c('sOpA','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${A.x}" y2="${A.y}"/>`;
   if(V('sOpB'))s+=`<line pathLength="1" class="${c('sOpB','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${B.x}" y2="${B.y}"/>`;

   if(V('sqM'))s+=`<path class="${c('sqM','sq',1)}" d="${rightAngle({x:midX,y:cy},A,O)}"/>`;

   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-10}" y="${O.y-10}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y-10}">O′</text>`;
   if(V('pA'))s+=`<circle class="pt-tan nf" cx="${A.x}" cy="${A.y}" r="4.5"/><text class="lb nf" x="${A.x-4}" y="${A.y-10}">A</text>`;
   if(V('pB'))s+=`<circle class="pt-tan nf" cx="${B.x}" cy="${B.y}" r="4.5"/><text class="lb nf" x="${B.x-4}" y="${B.y+22}">B</text>`;
   if(V('pM'))s+=`<circle class="pt nf" cx="${midX}" cy="${cy}" r="3.5"/><text class="lb nf" x="${midX+5}" y="${cy+18}">M</text>`;

   if(calcBox){
    calcBox.innerHTML=`<span>نصف وتر: <b>AM = ${(h/16).toFixed(1)}</b></span> <span>کل وتر: <b>AB = ${((2*h)/16).toFixed(1)}</b></span>`;
   }
  }

  svg.innerHTML=s;fresh.clear();
 }

 buildControls();

 const cue=(sh,h)=>{
  (sh||'').split(' ').filter(Boolean).forEach(k=>{if(!vis.has(k)){vis.add(k);fresh.add(k)}});
  hl=h||{};draw();
 };

 draw();
 return{w,cue};
}

stage(0);
</script>
</body>
</html>
