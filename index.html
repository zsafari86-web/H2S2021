<head>
<meta charset="utf-8">

<title>محاسبه طول مماس‌های مشترک و وتر مشترک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f7;--ink:#12303a;--teal:#0b7f80;--blue:#2563eb;--pink:#d1346f;--am:#c98500;--card:#fff;--line:#cfe3e0;--ok:#1b8f5a;--mut:#6a858c;--pur:#8e63f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1f;--ink:#e3f1ef;--teal:#37c4be;--blue:#60a5fa;--pink:#ff7aa8;--am:#ffc247;--card:#16282d;--line:#27424a;--ok:#4fd592;--mut:#97b3b8;--pur:#c084fc}}
:root[data-theme="dark"]{--bg:#0e1b1f;--ink:#e3f1ef;--teal:#37c4be;--blue:#60a5fa;--pink:#ff7aa8;--am:#ffc247;--card:#16282d;--line:#27424a;--ok:#4fd592;--mut:#97b3b8;--pur:#c084fc}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:2.1;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
header{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header b{font-size:1.1rem;font-weight:800}
.author{font-size:.85rem;font-weight:600;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font:inherit;font-size:.8rem;cursor:pointer;line-height:1}
.dots button.on{background:#fff;color:var(--teal);font-weight:800}
.skip{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:2px 12px;font:inherit;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:0 14px 60px}
#fig{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:10px;background:var(--bg)}
#fig:empty{display:none}
#txt>*{scroll-margin-top:46vh}
h2{margin:14px 0 6px;font-size:1.3rem;color:var(--teal);font-weight:800}
.p,.ex{margin:8px 0}
.obj{border:2px solid var(--blue);border-right:6px solid var(--blue);border-radius:10px;background:var(--card);padding:10px 16px;margin:12px 0;font-weight:700;color:var(--blue);line-height:2.2}
.d{border:2px solid var(--teal);border-radius:12px;background:var(--card);padding:12px 16px;margin:12px 0;font-weight:600;line-height:2.2}
.ex{border-right:4px solid var(--pink);padding:6px 14px;background:var(--card);border-radius:6px;line-height:2.2}
.f,.f2{direction:ltr!important;text-align:center;font-weight:700;color:var(--pink);margin:8px auto;padding:6px 12px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;line-height:1.8;background:rgba(209,52,111,.04);border-radius:8px;border:1px dashed rgba(209,52,111,.2);unicode-bidi:isolate}
.f{font-size:1.22rem;min-height:2.2em}
.f2{font-size:1.12rem}

/* ساختار ریاضی رادیکال و فرمول بدون شکستگی */
.math-tag{direction:ltr!important;font-family:inherit;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--pink);background:rgba(209,52,111,.06);padding:3px 8px;border-radius:6px;border:1px dashed rgba(209,52,111,.25);font-size:1rem}

.rad {
    display: inline-flex;
    align-items: flex-start;
    direction: ltr;
    unicode-bidi: isolate;
    white-space: nowrap;
    margin: 0 3px;
    vertical-align: middle;
    position: relative;
    top: 1px;
}
.r-sym {
    font-size: 1.35em;
    line-height: 1;
    margin-right: -2px;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
}
.r-body {
    border-top: 2.5px solid currentColor;
    padding: 0 6px;
    padding-top: 1px;
    line-height: 1.3;
    display: inline-block;
    white-space: nowrap;
    font-size: 1em;
}
/* استایل برای جلوگیری از شکستن عبارات ریاضی درون متن */
.math-inline {
    display: inline-block;
    direction: ltr;
    unicode-bidi: isolate;
    white-space: nowrap;
    vertical-align: middle;
    margin: 0 2px;
}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .35em;line-height:1.2}
.fr .n{border-bottom:2px solid currentColor;padding:0 .45em}.fr .dn{padding:0 .45em}
.typing::after{content:"▍";color:var(--pink);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.demo,.quiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin:12px 0; text-align: right;}
#fig .demo{margin:0;box-shadow:0 8px 10px -8px rgba(0,0,0,.4)}
svg{user-select:none;-webkit-user-select:none;width:100%;height:auto;display:block;direction:ltr;touch-action:none;max-height:38vh}
button.go,.opt{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--teal);background:transparent;color:var(--ink);padding:4px 14px}
button.go{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600;margin:8px 0}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.opt{min-width:90px;font-weight:600;text-align: right; line-height: 1.6; padding: 8px 12px;}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--pink);color:var(--pink)}
.fb{min-height:1.8em;color:var(--mut); text-align: right; direction: rtl; padding-top: 8px;}

/* استایل جدول بهینه‌شده برای موبایل و تبلت */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.03)}
.tbl-hint{font-size:.78rem;color:var(--mut);text-align:center;padding:6px;background:rgba(11,127,128,.05);border-bottom:1px solid var(--line)}
.tbl{width:100%;min-width:520px;border-collapse:collapse}
.tbl th,.tbl td{border:1px solid var(--line);padding:10px 12px;text-align:center;font-size:.9rem;vertical-align:middle}
.tbl th{background:rgba(11,127,128,.14);color:var(--teal);font-weight:800;white-space:nowrap}
.tbl tr:hover{background:rgba(11,127,128,.04)}
.tbl .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:.85rem}
.badge-ext{background:rgba(37,99,235,.12);color:var(--blue)}
.badge-int{background:rgba(209,52,111,.12);color:var(--pink)}

/* پالت رنگی SVG */
circle.cir-blue{fill:none;stroke:var(--blue);stroke-width:2.2}
circle.cir-pur{fill:none;stroke:var(--pur);stroke-width:2.2}
circle.aux{fill:none;stroke:var(--pur);stroke-width:2;stroke-dasharray:5 4}
.ln-blue{stroke:var(--blue);stroke-width:2}
.ln-pur{stroke:var(--pur);stroke-width:2}
.ln{stroke:var(--ink);stroke-width:1.8}
.ln-tan{stroke:var(--teal);stroke-width:2.6;stroke-linecap:round}
.ln-help{stroke:var(--pink);stroke-width:2;stroke-dasharray:5 4}
.pt{fill:var(--card);stroke:var(--ink);stroke-width:2}
.pt-blue{fill:var(--blue);stroke:#fff;stroke-width:2}
.pt-pur{fill:var(--pur);stroke:#fff;stroke-width:2}
.pt-tan{fill:var(--am);stroke:var(--ink);stroke-width:1.8}
.tf{fill:none;stroke:none}
.tf.h1{fill:var(--blue);fill-opacity:.22;stroke:var(--blue);stroke-width:2}
.tf.h2{fill:var(--pur);fill-opacity:.22;stroke:var(--pur);stroke-width:2}
.sq{fill:none;stroke:var(--pink);stroke-width:2}
text.lb{font:600 15px Vazirmatn,sans-serif;fill:var(--ink)}

.st{font-weight:800;color:var(--pink);margin:14px 0 2px}
.nw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.nf{animation:fi 0.8s}
@keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.typing::after,.nw,.nf{animation:none}.nw{stroke-dasharray:none}}
</style>

<script>
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
let fast=false,run=0,F=null;
$('#skip').onclick=()=>fast=true;
const scroll=e=>{const r=e.getBoundingClientRect();if(r.bottom>innerHeight-30)window.scrollBy({top:r.bottom-innerHeight+90,behavior:'auto'})};

// تابع اصلاح‌شده برای جلوگیری از شکستن عبارات ریاضی، بدون دست زدن به کدهای HTML
function formatMath(str){
 let s = str;
 // ۱. رادیکال‌ها
 s = s.replace(/√\(((?:\([^()]+\)|[^()])+)\)/g, '<span class="rad"><span class="r-sym">√</span><span class="r-body">($1)</span></span>');
 s = s.replace(/√([0-9a-zA-Z\u200E′²³]+)/g, '<span class="rad"><span class="r-sym">√</span><span class="r-body">$1</span></span>');
 // ۲. کسرها
 s = s.replace(/(\S+) \/ (\S+)/g, '<span class="fr"><span class="n">$1</span><span class="dn">$2</span></span>');
 
 // ۳. ایزوله کردن عبارات داخل پرانتز که شامل حروف انگلیسی هستند (مثل (R + R′)²)
 s = s.replace(/\(([a-zA-Z0-9′²³\s\+\-]+)\)²/g, '<span class="math-inline">($1)²</span>');
 s = s.replace(/\(([a-zA-Z0-9′²³\s\+\-]+)\)/g, function(match, p1) {
     if (/[a-zA-Z]/.test(p1)) {
         return '<span class="math-inline">(' + p1 + ')</span>';
     }
     return match;
 });
 
 // ۴. ایزوله کردن متغیرهایی مثل R + R′ در متن
 s = s.replace(/(R \s*[\+\-]\s*R′)/g, '<span class="math-inline">$1</span>');
 
 return s;
}

async function typeInto(e,txt,tok){
 e.classList.add('typing');let n=0;
 for(const ch of txt){
  if(tok!==run)return;
  e.textContent+=ch;
  if(++n%5===0)scroll(e);
  if(!fast)await sleep(ch===' '?28:55);
 }
 scroll(e);
 e.classList.remove('typing');
}

async function typeFormula(e,str,tok){
 e.classList.add('typing');
 e.innerHTML=formatMath(str);
 scroll(e);
 if(!fast)await sleep(350);
 e.classList.remove('typing');
}

function mark(i){document.querySelectorAll('#dots button').forEach((b,j)=>b.classList.toggle('on',i===j));}
S.forEach((s,i)=>{const b=el('button');b.textContent=i+1;b.onclick=()=>stage(i);$('#dots').append(b)});

async function stage(i){
 const tok=++run;fast=false;const s=S[i],box=$('#txt');box.innerHTML='';mark(i);window.scrollTo(0,0);
 $('#fig').innerHTML='';F=s.k?mkFig(s.k):null;if(F)$('#fig').append(F.w);
 const h=el('h2');box.append(h);await typeInto(h,s.h,tok);
 for(const [k,v,sh,hl] of s.items){
  if(tok!==run)return;
  if(k==='tbl'){
   const tw=el('div','tbl-wrap');tw.innerHTML=v;box.append(tw);scroll(tw);
   if(!fast)await sleep(500);continue;
  }
  if(k==='quiz'){await quiz(box,v);continue}
  if(k==='btn'){await gate(box,v);continue}
  const e=el('div',k==='obj'?'obj':k);box.append(e);scroll(e);
  const segs=Array.isArray(v)?v:[[v,sh,hl]];
  for(const [t,a,b] of segs){
    if(tok!==run)return;
    if(F&&(a!=null||b))F.cue(a,b);
    await (k==='f'||k==='f2'?typeFormula:typeInto)(e,t,tok);
  }
  if(!fast)await sleep(k==='p'||k==='ex'||k==='d'||k==='obj'?500:300);
 }
 if(tok!==run)return;
 const n=el('button','go');n.textContent=i<S.length-1?'گام بعدی ◀':'شروع دوباره';n.onclick=()=>stage((i+1)%S.length);box.append(n);scroll(n);
}
function gate(box,label){return new Promise(r=>{const b=el('button','go');b.textContent=label;b.onclick=()=>{b.remove();r()};box.append(b)})}

function quiz(box,v){return new Promise(res=>{
 const q=el('div','quiz'),t=el('b'),row=el('div','opts'),fb=el('div','fb');
 
 t.innerHTML = formatMath(v.q); 
 t.style.textAlign = 'right';
 
 v.o.forEach((s,i)=>{
   const b=el('button','opt');
   b.dir='rtl';
   b.style.textAlign = 'right';
   b.innerHTML=formatMath(s);
   b.onclick=()=>{
    if(i===v.a){
      b.classList.add('ok');
      let answerHTML = formatMath(v.e);
      
      // اگر پاسخ شامل متن فارسی بود، به صورت راست‌چین نمایش داده می‌شود
      if (/[\u0600-\u06FF]/.test(v.e)) {
         fb.innerHTML = 'آفرین! ' + answerHTML;
      } else {
         fb.innerHTML = 'آفرین! <br><span dir="ltr" style="display:inline-block; font-weight:bold; color:var(--ok); margin-top:4px;">' + answerHTML + '</span>';
      }
      fb.setAttribute('dir', 'rtl');
      fb.style.textAlign = 'right';
      
      row.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(res,1500);
    } else {
      b.classList.add('no');
      fb.innerHTML='دوباره فکر کن. راهنما: ' + formatMath(v.h);
      fb.setAttribute('dir', 'rtl');
      fb.style.textAlign = 'right';
    }
   };
   row.append(b)
 });
 
 q.append(t,row,fb);box.append(q);scroll(q)})}

/* هندسه پویا با پالت رنگی آبی و بنفش */
function rightAngle(V,P1,P2,size=10){
 const v1={x:(P1.x-V.x)/Math.hypot(P1.x-V.x,P1.y-V.y),y:(P1.y-V.y)/Math.hypot(P1.x-V.x,P1.y-V.y)};
 const v2={x:(P2.x-V.x)/Math.hypot(P2.x-V.x,P2.y-V.y),y:(P2.y-V.y)/Math.hypot(P2.x-V.x,P2.y-V.y)};
 const a={x:V.x+v1.x*size,y:V.y+v1.y*size};
 const b={x:a.x+v2.x*size,y:a.y+v2.y*size};
 const c={x:V.x+v2.x*size,y:V.y+v2.y*size};
 return `M${a.x} ${a.y} L${b.x} ${b.y} L${c.x} ${c.y}`;
}

function mkFig(kind){
 const w=el('div','demo'),svg=document.createElementNS(NS,'svg');
 svg.setAttribute('viewBox','0 0 480 300');w.append(svg);
 const vis=new Set(),fresh=new Set();let hl={};

 function draw(){
  const c=(k,base,isFill)=>base+(hl[k]?' h'+hl[k]:'')+(fresh.has(k)?(isFill?' nf':' nw'):'');
  const V=k=>vis.has(k);
  let s='';

  if(kind==='fig_ext'||kind==='fig_aux'){
   const O={x:130,y:175}, O2={x:340,y:175}, R=68, R2=36, d=210;
   const sinG=(R-R2)/d, cosG=Math.sqrt(1-sinG*sinG);
   const T={x:O.x+R*sinG, y:O.y-R*cosG};
   const T2={x:O2.x+R2*sinG, y:O2.y-R2*cosG};
   const H={x:O.x+(R-R2)*sinG, y:O.y-(R-R2)*cosG};

   if(V('triH'))s+=`<polygon class="${c('triH','tf h2',1)}" points="${O.x},${O.y} ${O2.x},${O2.y} ${H.x},${H.y}"/>`;
   if(V('rectH'))s+=`<polygon class="${c('rectH','tf h1',1)}" points="${H.x},${H.y} ${O2.x},${O2.y} ${T2.x},${T2.y} ${T.x},${T.y}"/>`;

   if(V('sOO'))s+=`<line pathLength="1" class="${c('sOO','ln')}" stroke-dasharray="4 4" x1="${O.x}" y1="${O.y}" x2="${O2.x}" y2="${O2.y}"/>`;
   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;

   if(V('circAux'))s+=`<circle class="${c('circAux','aux',1)}" cx="${O.x}" cy="${O.y}" r="${R-R2}"/>`;

   if(V('sOT'))s+=`<line pathLength="1" class="${c('sOT','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${T.x}" y2="${T.y}"/>`;
   if(V('sOpTp'))s+=`<line pathLength="1" class="${c('sOpTp','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${T2.x}" y2="${T2.y}"/>`;
   if(V('lineOpH'))s+=`<line pathLength="1" class="${c('lineOpH','ln-help')}" x1="${O2.x}" y1="${O2.y}" x2="${H.x}" y2="${H.y}"/>`;
   if(V('lineM'))s+=`<line pathLength="1" class="${c('lineM','ln-tan')}" x1="${T.x-45*cosG}" y1="${T.y-45*sinG}" x2="${T2.x+45*cosG}" y2="${T2.y+45*sinG}"/>`;

   if(V('sqT'))s+=`<path class="${c('sqT','sq',1)}" d="${rightAngle(T,O,T2)}"/>`;
   if(V('sqTp'))s+=`<path class="${c('sqTp','sq',1)}" d="${rightAngle(T2,O2,T)}"/>`;
   if(V('sqH'))s+=`<path class="${c('sqH','sq',1)}" d="${rightAngle(H,O,O2)}"/>`;

   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-8}" y="${O.y+22}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y+22}">O′</text>`;
   if(V('pT'))s+=`<circle class="pt-tan nf" cx="${T.x}" cy="${T.y}" r="4.5"/><text class="lb nf" x="${T.x-8}" y="${T.y-10}">T</text>`;
   if(V('pTp'))s+=`<circle class="pt-tan nf" cx="${T2.x}" cy="${T2.y}" r="4.5"/><text class="lb nf" x="${T2.x+6}" y="${T2.y-10}">T′</text>`;
   if(V('pH'))s+=`<circle class="pt nf" cx="${H.x}" cy="${H.y}" r="4"/><text class="lb nf" x="${H.x-18}" y="${H.y+8}">H</text>`;
  }
  else if(kind==='fig_int'){
   const O={x:120,y:170}, O2={x:350,y:170}, R=56, R2=36, d=230;
   const sinB=(R+R2)/d, cosB=Math.sqrt(1-sinB*sinB);
   const T={x:O.x+R*sinB, y:O.y-R*cosB};
   const T2={x:O2.x-R2*sinB, y:O2.y+R2*cosB};
   const H={x:O.x+(R+R2)*sinB, y:O.y-(R+R2)*cosB};

   if(V('triH'))s+=`<polygon class="${c('triH','tf h1',1)}" points="${O.x},${O.y} ${O2.x},${O2.y} ${H.x},${H.y}"/>`;
   if(V('rectH'))s+=`<polygon class="${c('rectH','tf h2',1)}" points="${H.x},${H.y} ${O2.x},${O2.y} ${T2.x},${T2.y} ${T.x},${T.y}"/>`;

   if(V('sOO'))s+=`<line pathLength="1" class="${c('sOO','ln')}" stroke-dasharray="4 4" x1="${O.x}" y1="${O.y}" x2="${O2.x}" y2="${O2.y}"/>`;
   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;

   if(V('sOT'))s+=`<line pathLength="1" class="${c('sOT','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${T.x}" y2="${T.y}"/>`;
   if(V('extOT'))s+=`<line pathLength="1" class="${c('extOT','ln-help')}" x1="${T.x}" y1="${T.y}" x2="${H.x}" y2="${H.y}"/>`;
   if(V('sOpTp'))s+=`<line pathLength="1" class="${c('sOpTp','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${T2.x}" y2="${T2.y}"/>`;
   if(V('lineOpH'))s+=`<line pathLength="1" class="${c('lineOpH','ln-help')}" x1="${O2.x}" y1="${O2.y}" x2="${H.x}" y2="${H.y}"/>`;
   if(V('lineM'))s+=`<line pathLength="1" class="${c('lineM','ln-tan')}" style="stroke:var(--teal)" x1="${T.x-45*cosB}" y1="${T.y-45*sinB}" x2="${T2.x+45*cosB}" y2="${T2.y+45*sinB}"/>`;

   if(V('sqT'))s+=`<path class="${c('sqT','sq',1)}" d="${rightAngle(T,O,T2)}"/>`;
   if(V('sqTp'))s+=`<path class="${c('sqTp','sq',1)}" d="${rightAngle(T2,O2,T)}"/>`;
   if(V('sqH'))s+=`<path class="${c('sqH','sq',1)}" d="${rightAngle(H,O,O2)}"/>`;

   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-8}" y="${O.y+22}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y+22}">O′</text>`;
   if(V('pT'))s+=`<circle class="pt-tan nf" cx="${T.x}" cy="${T.y}" r="4.5"/><text class="lb nf" x="${T.x-14}" y="${T.y-10}">T</text>`;
   if(V('pTp'))s+=`<circle class="pt-tan nf" cx="${T2.x}" cy="${T2.y}" r="4.5"/><text class="lb nf" x="${T2.x+10}" y="${T2.y+10}">T′</text>`;
   if(V('pH'))s+=`<circle class="pt nf" cx="${H.x}" cy="${H.y}" r="4"/><text class="lb nf" x="${H.x+8}" y="${H.y-6}">H</text>`;
  }
  else if(kind==='fig_tan_ext'){
   const O={x:150,y:175}, R=68, R2=36, d=R+R2, O2={x:O.x+d,y:175};
   const sinG=(R-R2)/d, cosG=Math.sqrt(1-sinG*sinG);
   const T={x:O.x+R*sinG, y:O.y-R*cosG};
   const T2={x:O2.x+R2*sinG, y:O2.y-R2*cosG};

   if(V('sOO'))s+=`<line pathLength="1" class="${c('sOO','ln')}" stroke-dasharray="4 4" x1="${O.x}" y1="${O.y}" x2="${O2.x}" y2="${O2.y}"/>`;
   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;

   if(V('sOT'))s+=`<line pathLength="1" class="${c('sOT','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${T.x}" y2="${T.y}"/>`;
   if(V('sOpTp'))s+=`<line pathLength="1" class="${c('sOpTp','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${T2.x}" y2="${T2.y}"/>`;
   if(V('lineM'))s+=`<line pathLength="1" class="${c('lineM','ln-tan')}" x1="${T.x-40*cosG}" y1="${T.y-40*sinG}" x2="${T2.x+40*cosG}" y2="${T2.y+40*sinG}"/>`;

   if(V('pC'))s+=`<circle class="pt-tan nf" cx="${O.x+R}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x+R-4}" y="${O.y-10}">C</text>`;
   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-8}" y="${O.y+22}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y+22}">O′</text>`;
   if(V('pT'))s+=`<circle class="pt-tan nf" cx="${T.x}" cy="${T.y}" r="4.5"/><text class="lb nf" x="${T.x-8}" y="${T.y-10}">T</text>`;
   if(V('pTp'))s+=`<circle class="pt-tan nf" cx="${T2.x}" cy="${T2.y}" r="4.5"/><text class="lb nf" x="${T2.x+6}" y="${T2.y-10}">T′</text>`;
  }
  else if(kind==='fig_sec'){
   const O={x:170,y:160}, O2={x:290,y:160}, R=72, R2=58, d=120;
   const a=(R*R-R2*R2+d*d)/(2*d);
   const h=Math.sqrt(Math.max(0,R*R-a*a));
   const midX=O.x+a;
   const A={x:midX,y:O.y-h};
   const B={x:midX,y:O.y+h};

   if(V('circ1'))s+=`<circle pathLength="1" class="${c('circ1','cir-blue')}" cx="${O.x}" cy="${O.y}" r="${R}"/>`;
   if(V('circ2'))s+=`<circle pathLength="1" class="${c('circ2','cir-pur')}" cx="${O2.x}" cy="${O2.y}" r="${R2}"/>`;

   if(V('lineOO'))s+=`<line pathLength="1" class="${c('lineOO','ln')}" style="stroke:var(--teal);stroke-width:2.4" x1="${O.x-30}" y1="${O.y}" x2="${O2.x+30}" y2="${O2.y}"/>`;
   if(V('chordAB'))s+=`<line pathLength="1" class="${c('chordAB','ln')}" style="stroke:var(--pink);stroke-width:2.6" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;

   if(V('sOA'))s+=`<line pathLength="1" class="${c('sOA','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${A.x}" y2="${A.y}"/>`;
   if(V('sOB'))s+=`<line pathLength="1" class="${c('sOB','ln-blue')}" x1="${O.x}" y1="${O.y}" x2="${B.x}" y2="${B.y}"/>`;
   if(V('sOpA'))s+=`<line pathLength="1" class="${c('sOpA','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${A.x}" y2="${A.y}"/>`;
   if(V('sOpB'))s+=`<line pathLength="1" class="${c('sOpB','ln-pur')}" x1="${O2.x}" y1="${O2.y}" x2="${B.x}" y2="${B.y}"/>`;

   if(V('sqM'))s+=`<path class="${c('sqM','sq',1)}" d="${rightAngle({x:midX,y:O.y},A,O)}"/>`;

   if(V('pO'))s+=`<circle class="pt-blue nf" cx="${O.x}" cy="${O.y}" r="5"/><text class="lb nf" x="${O.x-10}" y="${O.y-10}">O</text>`;
   if(V('pOp'))s+=`<circle class="pt-pur nf" cx="${O2.x}" cy="${O2.y}" r="5"/><text class="lb nf" x="${O2.x+6}" y="${O2.y-10}">O′</text>`;
   if(V('pA'))s+=`<circle class="pt-tan nf" cx="${A.x}" cy="${A.y}" r="4.5"/><text class="lb nf" x="${A.x-4}" y="${A.y-10}">A</text>`;
   if(V('pB'))s+=`<circle class="pt-tan nf" cx="${B.x}" cy="${B.y}" r="4.5"/><text class="lb nf" x="${B.x-4}" y="${B.y+22}">B</text>`;
   if(V('pM'))s+=`<circle class="pt nf" cx="${midX}" cy="${O.y}" r="3.5"/><text class="lb nf" x="${midX+4}" y="${O.y+16}">M</text>`;
  }

  svg.innerHTML=s;fresh.clear();
 }

 const cue=(sh,h)=>{
  (sh||'').split(' ').filter(Boolean).forEach(k=>{if(!vis.has(k)){vis.add(k);fresh.add(k)}});
  hl=h||{};draw();
 };

 draw();
 return{w,cue};
}

stage(0);
</script>
</body>
</html>
